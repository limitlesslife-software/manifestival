# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Gradle-daemon kiinnitetty paikalliseen JDK 21:een. Syy on Capacitor 8, ei
# Gradle: android/app/capacitor.build.gradle (generoitu) ja
# node_modules/@capacitor/android/capacitor/build.gradle kaantavat tasolla
# JavaVersion.VERSION_21, joten JDK 17 kaatuu virheeseen
# "invalid source release: 21". (Gradle 9.x itse toimii JVM 17+:lla.)
# Taman koneen komentotulkin JAVA_HOME on Temurin 17, siksi kiinnitys.
#
# Polku on koneen oma ja silti versionhallinnassa. Vaihtoehdot ovat
# omistajan/kehityksen valinta (docs/activation/ANDROID-ACCEPTANCE-BUILD.md):
#   a) siirra tama rivi tiedostoon %USERPROFILE%\.gradle\gradle.properties
#      (repon ulkopuolelle, kuten android/local.properties)
#   b) korvaa se tiedostolla gradle/gradle-daemon-jvm.properties
#      (toolchainVersion=21), jolloin Gradle valitsee minka tahansa JDK 21:n
# Siihen asti scripts/android-acceptance-build.mjs tarkistaa, etta hakemisto
# on olemassa. Asetus koskee vain tata Gradle-projektia.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot
