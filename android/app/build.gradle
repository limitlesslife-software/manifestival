apply plugin: 'com.android.application'

// ---------------------------------------------------------------- versiointi
//
// versionCode ja versionName tulevat Gradle-ominaisuuksista, jotka
// scripts/android-acceptance-build.mjs antaa:
//   -Pmanifestival.versionCode=<N> -Pmanifestival.versionName=<nimi>
// Ilman niita oletukset ovat 1 ja package.jsonin versio, joten tavallinen
// "npm run build:android" kayttaytyy kuten ennenkin (versionCode 1).
// Debug-koonti lisaa nimeen paatteen "-debug" (buildTypes alla), esim.
// 1.0.0-waveJ.v23+5df40b2-debug.
//
// versionCode > 1 puhelimeen on OMISTAJAN TUOTEPAATOS (OWNER PRODUCT
// DECISION): kun laitteessa on suurempi versionCode, vanhempaa APK:ta ei voi
// asentaa paalle ilman sovelluksen poistoa. Ks.
// docs/activation/ANDROID-ACCEPTANCE-BUILD.md, kohta "Versiointi".
//
// Sovellustunnukseen EI lisata debug-paatetta: hyvaksyntakoonti on laitteella
// sama sovellus (sama istunto, samat muistutukset). tests/android-version.test.mjs
// vartioi taman.
def mfVersionCodeRaw = (project.findProperty('manifestival.versionCode') ?: '1').toString().trim()
if (!(mfVersionCodeRaw ==~ /\d{1,10}/)) {
    throw new GradleException("manifestival.versionCode ei ole kokonaisluku: '${mfVersionCodeRaw}'")
}
def mfVersionCodeLong = mfVersionCodeRaw.toLong()
// Google Playn ylaraja on 2100000000; Android vaatii positiivisen luvun.
if (mfVersionCodeLong < 1L || mfVersionCodeLong > 2100000000L) {
    throw new GradleException("manifestival.versionCode ${mfVersionCodeLong} ei ole valilla 1..2100000000")
}
def mfVersionCode = mfVersionCodeLong.intValue()
def mfVersionName = (project.findProperty('manifestival.versionName') ?: '1.0.0').toString().trim()
if (!(mfVersionName ==~ /[0-9A-Za-z.+_-]{1,100}/)) {
    throw new GradleException("manifestival.versionName sisaltaa kiellettyja merkkeja: '${mfVersionName}'")
}

android {
    namespace = "fi.limitlesslife.manifestival"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fi.limitlesslife.manifestival"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = mfVersionCode
        versionName = mfVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Nakyy laitteella: Asetukset > Sovellukset > Manifestival > versio.
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
